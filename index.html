<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - Nova Poshta Shopping</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f9fafb; /* Легкий фон, чтобы белая форма выделялась */
        }
        .custom-checkbox {
            appearance: none;
            background-color: #fff;
            margin: 0;
            font: inherit;
            color: currentColor;
            width: 1.15em;
            height: 1.15em;
            border: 1px solid #cbd5e1;
            border-radius: 0.25em;
            display: grid;
            place-content: center;
            cursor: pointer;
            transition: border-color 0.2s ease-in-out;
        }
        .custom-checkbox::before {
            content: "";
            width: 0.65em;
            height: 0.65em;
            transform: scale(0);
            transition: 120ms transform ease-in-out;
            box-shadow: inset 1em 1em white;
            background-color: white;
            transform-origin: center;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }
        .custom-checkbox:checked {
            background-color: #ed1c24;
            border-color: #ed1c24;
        }
        .custom-checkbox:checked::before {
            transform: scale(1);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen text-gray-900 py-10">

    <div class="w-full max-w-5xl p-6 sm:p-10 bg-white rounded-2xl shadow-sm relative">
        
        <!-- Переключатель языков (Новый дизайн) -->
        <div class="absolute top-6 right-6 bg-gray-100 p-1 rounded-lg flex text-sm font-medium">
            <button onclick="setLanguage('ru')" id="btn-ru" class="px-4 py-1.5 rounded-md bg-white text-gray-900 shadow-sm transition-all">RU</button>
            <button onclick="setLanguage('ro')" id="btn-ro" class="px-4 py-1.5 rounded-md text-gray-500 hover:text-gray-900 transition-all">RO</button>
        </div>

        <h1 id="t-title" class="text-4xl font-bold text-center mb-16 mt-4">Регистрация</h1>

        <div class="relative grid grid-cols-1 md:grid-cols-2 gap-10 md:gap-20">
            
            <div class="hidden md:block absolute left-1/2 top-0 bottom-10 w-[1px] bg-gray-200 transform -translate-x-1/2"></div>

            <!-- ЛЕВАЯ КОЛОНКА -->
            <div class="flex flex-col">
                <p id="t-subtitle" class="mb-6 text-[15px]">Заполните поля на румынском языке (латиницей)</p>

                <form class="space-y-5" onsubmit="event.preventDefault();">
                    
                    <div class="grid grid-cols-2 gap-4">
                        <input type="text" id="p-lastName" placeholder="Фамилия" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:border-red-500 transition-colors text-[15px] placeholder-gray-400">
                        <input type="text" id="p-firstName" placeholder="Имя" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:border-red-500 transition-colors text-[15px] placeholder-gray-400">
                    </div>

                    <input type="tel" id="p-phone" placeholder="Номер телефона" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:border-red-500 transition-colors text-[15px] placeholder-gray-400">

                    <input type="email" placeholder="Email" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:border-red-500 transition-colors text-[15px] placeholder-gray-400">

                    <div class="relative">
                        <input type="password" id="p-password" placeholder="Пароль" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:border-red-500 transition-colors text-[15px] placeholder-gray-400">
                        <button type="button" class="absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600">
                            <i class="fa-regular fa-eye-slash"></i>
                        </button>
                    </div>

                    <div class="mt-6 space-y-6">
                        <!-- Основные условия (Оферта и Условия) -->
                        <p class="text-[12px] text-center text-gray-500 leading-relaxed px-2">
                            <span id="t-termsText1">Регистрируясь, вы соглашаетесь с условиями</span><br>
                            <a href="#offer" id="t-offerLink" class="text-gray-800 underline hover:text-[#ed1c24] transition-colors">Договора присоединения о предоставлении услуг международной экспресс-доставки</a> <span id="t-termsText2">и</span> 
                            <a href="#terms" id="t-termsLink" class="text-gray-800 underline hover:text-[#ed1c24] transition-colors">Условиями предоставления услуг Nova Poshta Shopping</a>
                        </p>

                        <!-- Чекбокс маркетинга + Политика приватности -->
                        <label class="flex items-start gap-3 cursor-pointer group">
                            <div class="relative flex items-start pt-0.5">
                                <input type="checkbox" id="privacy_marketing" class="custom-checkbox flex-shrink-0 peer">
                            </div>
                            <span class="text-[13px] text-gray-600 leading-snug select-none group-hover:text-gray-800 transition-colors">
                                <span id="t-marketingText">Я хочу получать уведомления об акциях и персональных скидках в соответствии с </span><a href="#privacy" id="t-privacyLink" class="text-gray-800 font-medium underline hover:text-[#ed1c24] transition-colors" onclick="event.stopPropagation()">Политикой приватности</a>.
                            </span>
                        </label>

                        <button type="submit" id="t-submitBtn" class="w-full bg-[#ed1c24] hover:bg-[#d11a20] text-white font-medium py-3.5 rounded-full transition-all shadow-sm hover:shadow-md text-[15px]">
                            Зарегистрироваться
                        </button>
                    </div>
                </form>
            </div>

            <!-- ПРАВАЯ КОЛОНКА -->
            <div class="flex flex-col h-full">
                <div class="pt-8 md:pt-16">
                    <p id="t-socialTitle" class="text-center mb-8 text-[15px]">Или войдите через соцсети</p>

                    <div class="space-y-4 px-0 md:px-4">
                        <button class="w-full bg-[#3b5998] hover:bg-[#324b80] text-white font-medium py-3.5 rounded-2xl flex items-center justify-center gap-3 transition-colors text-[15px]">
                            <i class="fa-brands fa-facebook-f text-lg"></i>
                            <span id="t-fbBtn">Зарегистрироваться через Facebook</span>
                        </button>

                        <button class="w-full bg-[#f1f1f1] hover:bg-[#e2e2e2] text-gray-800 font-medium py-3.5 rounded-2xl flex items-center justify-center gap-3 transition-colors text-[15px]">
                            <svg class="w-5 h-5" viewBox="0 0 24 24">
                                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
                            </svg>
                            <span id="t-googleBtn">Зарегистрироваться через Google</span>
                        </button>
                    </div>
                </div>

                <div class="mt-auto pt-20 md:pt-0 text-center pb-2">
                    <p class="text-[15px]">
                        <span id="t-alreadyReg">Уже зарегистрированы? </span><a href="#login" id="t-loginLink" class="font-semibold hover:text-red-600 transition-colors">Войти</a>
                    </p>
                </div>
            </div>

        </div>
    </div>

    <!-- Скрипт для переключения языков -->
    <script>
        const translations = {
            ru: {
                title: "Регистрация",
                subtitle: "Заполните поля на румынском языке (латиницей)",
                lastName: "Фамилия",
                firstName: "Имя",
                phone: "Номер телефона",
                password: "Пароль",
                termsText1: "Регистрируясь, вы соглашаетесь с условиями",
                offerLink: "Договора присоединения о предоставлении услуг международной экспресс-доставки",
                termsText2: "и",
                termsLink: "Условиями предоставления услуг Nova Poshta Shopping",
                marketingText: "Я хочу получать уведомления об акциях и персональных скидках в соответствии с ",
                privacyLink: "Политикой приватности",
                submitBtn: "Зарегистрироваться",
                socialTitle: "Или войдите через соцсети",
                fbBtn: "Зарегистрироваться через Facebook",
                googleBtn: "Зарегистрироваться через Google",
                alreadyReg: "Уже зарегистрированы? ",
                loginLink: "Войти"
            },
            ro: {
                title: "Înregistrare",
                subtitle: "Completați câmpurile în limba română (cu caractere latine)",
                lastName: "Numele de familie",
                firstName: "Prenumele",
                phone: "Numărul de telefon",
                password: "Parola",
                termsText1: "Prin înregistrare, sunteți de acord cu termenii",
                offerLink: "Ofertei Publice",
                termsText2: "și cu",
                termsLink: "Termenii de furnizare a serviciilor Nova Poshta Shopping",
                marketingText: "Doresc să primesc notificări despre promoții și reduceri personale în conformitate cu ",
                privacyLink: "Politica de privatețe",
                submitBtn: "Creează cont",
                socialTitle: "Sau continuă cu rețelele sociale",
                fbBtn: "Înregistrare cu Facebook",
                googleBtn: "Înregistrare cu Google",
                alreadyReg: "Ai deja cont? ",
                loginLink: "Intră"
            }
        };

        function setLanguage(lang) {
            // Новые стили для кнопок-тумблеров
            const activeClass = 'px-4 py-1.5 rounded-md bg-white text-gray-900 shadow-sm transition-all';
            const inactiveClass = 'px-4 py-1.5 rounded-md text-gray-500 hover:text-gray-900 transition-all';
            
            document.getElementById('btn-ru').className = lang === 'ru' ? activeClass : inactiveClass;
            document.getElementById('btn-ro').className = lang === 'ro' ? activeClass : inactiveClass;

            // Обновляем текстовые узлы
            document.getElementById('t-title').innerText = translations[lang].title;
            document.getElementById('t-subtitle').innerText = translations[lang].subtitle;
            document.getElementById('t-termsText1').innerText = translations[lang].termsText1;
            document.getElementById('t-offerLink').innerText = translations[lang].offerLink;
            document.getElementById('t-termsText2').innerText = translations[lang].termsText2;
            document.getElementById('t-termsLink').innerHTML = translations[lang].termsLink;
            document.getElementById('t-marketingText').innerText = translations[lang].marketingText;
            document.getElementById('t-privacyLink').innerText = translations[lang].privacyLink;
            document.getElementById('t-submitBtn').innerText = translations[lang].submitBtn;
            document.getElementById('t-socialTitle').innerText = translations[lang].socialTitle;
            document.getElementById('t-fbBtn').innerText = translations[lang].fbBtn;
            document.getElementById('t-googleBtn').innerText = translations[lang].googleBtn;
            document.getElementById('t-alreadyReg').innerText = translations[lang].alreadyReg;
            document.getElementById('t-loginLink').innerText = translations[lang].loginLink;

            // Обновляем плейсхолдеры в инпутах
            document.getElementById('p-lastName').placeholder = translations[lang].lastName;
            document.getElementById('p-firstName').placeholder = translations[lang].firstName;
            document.getElementById('p-phone').placeholder = translations[lang].phone;
            document.getElementById('p-password').placeholder = translations[lang].password;
        }
    </script>
</body>
</html>
